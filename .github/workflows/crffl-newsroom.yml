require('dotenv').config({ path: '.env.local' });
const { GoogleGenerativeAI } = require('@google/generative-ai');
const { createClient } = require('@supabase/supabase-js');
const Parser = require('rss-parser');

const genAI = new GoogleGenerativeAI(process.env.GEMINI_API_KEY);
const supabase = createClient(process.env.NEXT_PUBLIC_SUPABASE_URL, process.env.NEXT_PUBLIC_SUPABASE_ANON_KEY);
const parser = new Parser();

// The CRFFL League ID
const SLEEPER_LEAGUE_ID = process.env.SLEEPER_LEAGUE_ID || 'JK42W9PP7V070';

const PERSONAS = [
    {
        name: 'Buck Callahan',
        style: 'Unapologetically biased towards Eric and his team "Rebel Scum", but if accused of bias, becomes extremely defensive and insists he is the most objective journalist in the country. Overly dramatic.'
    },
    {
        name: 'Dr. Marcus Vance',
        style: 'Obsessed with target shares, Expected Fantasy Points (xFP), and analytics. Insists his mathematical models are completely emotionless and objective, despite clearly favoring certain teams. Condescending to traditionalists.'
    },
    {
        name: 'Marty Sullivan',
        style: 'Grumpy, traditionalist, values "grit" and locker room culture. Despises modern analytics. Swears he calls it down the middle and has no favorites, but clearly holds grudges against managers who rely on spreadsheets.'
    }
];

// OFFSEASON MODE: We safely ping Sleeper just to see who is in the league, avoiding the transaction endpoints that crash.
async function getOffseasonLeagueData() {
    console.log("Fetching Offseason League Data...");
    try {
        const response = await fetch(`https://api.sleeper.app/v1/league/${SLEEPER_LEAGUE_ID}/users`);
        if (!response.ok) {
            return "The CRFFL league offices are currently closed. Managers are scouting in the shadows.";
        }
        const users = await response.json();
        const teamNames = users.map(u => u.metadata?.team_name || u.display_name).join(', ');
        
        return `We are currently in the CRFFL Offseason. No games are being played. Active managers plotting for the draft include: ${teamNames}.`;
    } catch (error) {
        return "The CRFFL league offices are currently closed for the offseason.";
    }
}

async function getRealWorldNews() {
    console.log("Fetching live real-world NFL news...");
    try {
        const feed = await parser.parseURL('https://www.espn.com/espn/rss/nfl/news');
        if (feed && feed.items && feed.items.length > 0) {
            return feed.items.slice(0, 5).map(item => `- ${item.title}`).join('\n');
        }
        return "No major NFL news today. Contract talks dominate the wires.";
    } catch (error) {
        return "NFL off-season workouts and contract talks are underway.";
    }
}

async function generateArticle() {
    console.log("Generating CRFFL Offseason column with AI...");
    const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" }); 
    const selectedPersona = PERSONAS[Math.floor(Math.random() * PERSONAS.length)];
    
    const leagueData = await getOffseasonLeagueData();
    const nflNews = await getRealWorldNews();
    
    const prompt = `
    You are ${selectedPersona.name}, a veteran sports columnist for the Columbia River Fantasy Football League (CRFFL).
    Your writing style: ${selectedPersona.style}
    
    Write a 400-500 word offseason column. 
    1. Acknowledge we are in the offseason preparing for the upcoming draft.
    2. Mention some of the active managers in the league based on the data provided.
    3. Discuss the real-world NFL news provided and how it might impact draft strategies.
    4. You MUST heavily imply your biases while simultaneously claiming to be a 100% objective, unbiased journalist.
    5. NEVER mention "artificial intelligence", "AI", or being a language model. Act entirely human.
    6. Format output in Markdown with an engaging H1 (#) headline at the top.

    CRFFL League Status:
    ${leagueData}

    Current NFL News:
    ${nflNews}
    `;

    try {
        const result = await model.generateContent(prompt);
        return { text: result.response.text(), persona: selectedPersona.name };
    } catch (error) {
        console.error("Gemini failed to generate text:", error);
        return null;
    }
}

async function runOffseasonNewsroom() {
    console.log("Starting Offseason Newsroom pipeline...");
    
    const generated = await generateArticle();
    if (!generated) {
        console.log("Failed to generate article.");
        return;
    }

    const titleMatch = generated.text.match(/^#\s+(.*)/m);
    const title = titleMatch ? titleMatch[1] : `CRFFL Offseason Dispatch`;
    const bodyWithoutTitle = generated.text.replace(/^#\s+.*\n?/, '').trim();

    const { error } = await supabase
        .from('articles')
        .insert([{ 
            title, 
            body: bodyWithoutTitle, 
            author_persona: generated.persona, 
            is_automated: true 
        }]);
        
    if (error) {
        console.error("Supabase Database error (Check your Row Level Security policies!):", error.message);
    } else {
        console.log(`SUCCESS! Published offseason article authored by ${generated.persona}.`);
    }
}

runOffseasonNewsroom();
